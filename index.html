<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://seifmomo.github.io/seif-eldin-portfolio/">
<link rel="canonical" href="https://seifmomo.github.io/seif-eldin-portfolio/">
<title>Saifeldin Mohamed Saied — Portfolio Has Moved</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:#080808;color:#f6f3ea;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{max-width:480px;text-align:center;border:1px solid rgba(200,160,40,.28);border-radius:18px;
    padding:38px 32px;background:linear-gradient(160deg,rgba(200,160,40,.07),rgba(0,0,0,0))}
  .mark{width:44px;height:44px;margin:0 auto 18px;border-radius:12px;
    background:linear-gradient(135deg,#c89b1e,#e8c766);display:grid;place-items:center;
    color:#080808;font-weight:800;font-size:1.1rem}
  h1{font-size:1.15rem;margin:0 0 10px;letter-spacing:.2px}
  p{color:rgba(246,243,234,.6);font-size:.9rem;line-height:1.6;margin:0 0 22px}
  a{display:inline-block;padding:11px 20px;border-radius:10px;text-decoration:none;
    background:linear-gradient(135deg,#c89b1e,#e8c766);color:#0a0a0a;font-weight:700;font-size:.85rem}
  a:hover{filter:brightness(1.07)}
</style>
</head>
<body>
  <main class="card">
    <div class="mark">SM</div>
    <h1>This portfolio has moved</h1>
    <p>You are being redirected to the new address.<br>If nothing happens, use the button below.</p>
    <a href="https://seifmomo.github.io/seif-eldin-portfolio/">Open the portfolio</a>
  </main>
  <script>location.replace("https://seifmomo.github.io/seif-eldin-portfolio/")</script>
</body>
</html>
